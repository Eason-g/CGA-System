server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: cga-server
  profiles:
    # 本机数据库账号放在 application-local.yml（不入库），见 server/README.md
    include: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cga?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input

app:
  # 演示日期：留空则使用系统日期；填写后系统“今天”固定为该日期（周次、月份都由它推算）
  today: 2026-11-20
  # 学期第一天（第 1 周的周一），用于计算当前教学周次
  semester-start: 2026-08-31
  # 种子用户的初始密码（启动时把空的 password_hash 设为它的 BCrypt 哈希）
  demo-password: Cga@2026
  jwt:
    # 开发默认密钥（至少 32 字节）。生产环境必须通过环境变量 APP_JWT_SECRET 覆盖！
    secret: ${APP_JWT_SECRET:cga-dev-only-secret-change-me-in-production-0123456789}
    ttl: 8h
  db:
    # 数据库初始化：if-empty（users 表不存在时建表并导入种子数据）/ always（每次启动重建）/ never（不动）
    init: if-empty
  demo:
    # 是否允许校级管理员调用 POST /api/demo/reset 重置演示数据
    reset-enabled: true
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
